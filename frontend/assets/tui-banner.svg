<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" role="img" aria-label="Structura Forge Terminal Banner">
  <defs>
    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-weight: 700;
        white-space: pre;
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- Terminal Panel Background & Emerald Border (matches structura.py) -->
  <rect x="2" y="2" width="756" height="236" rx="12" fill="#030504" stroke="#10B981" stroke-width="2" />

  <!-- Subtle Terminal Window Dots -->
  <circle cx="24" cy="22" r="5" fill="#10B981" fill-opacity="0.35" />
  <circle cx="42" cy="22" r="5" fill="#34D399" fill-opacity="0.5" />
  <circle cx="60" cy="22" r="5" fill="#6EE7B7" fill-opacity="0.7" />

  <!-- 5-Line Slant Wordmark in Exact Emerald Gradient -->
  <g class="mono" font-size="15" text-anchor="middle">
    <text x="380" y="64" fill="#6EE7B7" xml:space="preserve">  ____ _____ ____  _   _  ____ _____ _   _ ____     _    </text>
    <text x="380" y="83" fill="#34D399" xml:space="preserve"> / ___|_   _|  _ \| | | |/ ___|_   _| | | |  _ \   / \   </text>
    <text x="380" y="102" fill="#34D399" xml:space="preserve"> \___ \ | | | |_) | | | | |     | | | | | | |_) | / _ \  </text>
    <text x="380" y="121" fill="#10B981" xml:space="preserve">  ___) || | |  _ &lt;| |_| | |___  | | | |_| |  _ &lt; / ___ \ </text>
    <text x="380" y="140" fill="#10B981" xml:space="preserve"> |____/ |_| |_| \_\\___/ \____| |_|  \___/|_| \_/_/   \_\</text>
  </g>

  <!-- Subtitle -->
  <text x="380" y="174" class="title" font-size="14" fill="#FFFFFF" text-anchor="middle">
    PostgreSQL Architecture Mapping &amp; High-Velocity Seeder
  </text>

  <!-- Status Badge -->
  <g transform="translate(192, 192)">
    <rect x="0" y="0" width="146" height="24" rx="4" fill="#34D399" />
    <text x="73" y="16" class="mono" font-size="12" fill="#022016" text-anchor="middle">[ LIVE CONNECTED ]</text>
    <text x="160" y="16" class="mono" font-size="12" fill="#34D399">postgres@127.0.0.1:5432/postgres</text>
  </g>
</svg>
